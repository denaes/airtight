- id: php/sql-concatenation
  name: SQL query built by string concatenation or variable interpolation
  domain: appsec
  severity: critical
  confidence: firm
  tier: immediate
  cwe: CWE-89
  owasp: A03:2021
  files:
    - "**/*.php"
  match:
    regex: (?i)^(?!\s*(?://|\*|/\*|#)).*?(?:\b(?:(?:pdo|db|conn|connection|mysqli)\s*->\s*(?:query|exec|prepare|raw|select|statement)|\bDB\s*::\s*(?:raw|select|statement|unprepared))\s*\(\s*(?:(["'])(?:(?!\1).)*(?:\bSELECT\b(?:(?!\1).)*\bFROM\b|\bINSERT\s+INTO\b|\bUPDATE\b(?:(?!\1).)*\bSET\b|\bDELETE\s+FROM\b)(?:(?!\1).)*\1\s*\.\s*\$|\$query|\"SELECT\b[^\"]*\$[a-zA-Z_]))
  message: SQL statement executed with dynamic string concatenation or unescaped variable interpolation
  why: Concatenating or interpolating dynamic variables into raw SQL queries allows attackers
    to manipulate query structure and logic, enabling unauthorized data exfiltration or tampering.
  fix: Use parameterized prepared statements with PDO (prepare/execute with placeholders)
    or Laravel query builder parameter bindings instead of string concatenation.

- id: php/unserialize-untrusted
  name: Arbitrary object deserialization from untrusted input
  domain: appsec
  severity: critical
  confidence: confirmed
  tier: immediate
  cwe: CWE-502
  owasp: A08:2021
  files:
    - "**/*.php"
  match:
    regex: ^(?!\s*(?://|\*|/\*|#)).*?\bunserialize\s*\(\s*(?!\s*(?:true|false|null|["']\w+["']))\s*(?:\$[a-zA-Z_]\w*|\$_(?:GET|POST|COOKIE|REQUEST)|file_get_contents|base64_decode)
    not_regex: allowed_classes
  message: PHP unserialize() invoked on dynamic input, enabling PHP Object Injection
  why: Deserializing untrusted data with PHP unserialize() invokes magic methods (__wakeup,
    __destruct, __toString) on instantiated classes, enabling remote code execution via gadget chains.
  fix: Use json_decode() for structured data exchange, or specify allowed_classes => false
    in the unserialize options array.

- id: php/command-exec
  name: Operating system command executed via shell with dynamic arguments
  domain: appsec
  severity: critical
  confidence: firm
  tier: immediate
  cwe: CWE-78
  owasp: A03:2021
  files:
    - "**/*.php"
  match:
    regex: ^(?!\s*(?://|\*|/\*|#)).*?\b(?:system|exec|passthru|shell_exec|popen|proc_open)\s*\(\s*(?:(["'])(?:(?!\1).)*\1\s*\.\s*\$|\$|\"(?:[^\"]*)\$[a-zA-Z_])
  message: Shell execution function invoked with dynamic variable arguments
  why: Passing unescaped or concatenated user variables to system shell execution functions
    allows attackers to inject arbitrary shell metacharacters and execute OS commands.
  fix: Avoid shell execution where possible, or use escapeshellarg() and escapeshellcmd()
    on all dynamic arguments.

- id: php/blade-unescaped-xss
  name: Blade template unescaped raw output rendering variables
  domain: appsec
  severity: high
  confidence: firm
  tier: immediate
  cwe: CWE-79
  owasp: A03:2021
  files:
    - "**/*.blade.php"
    - "**/*.php"
  match:
    regex: \{!!\s*\$(?!(?:safe|trusted|errors|csrf|slot|svg|icon)\b)[a-zA-Z_]\w*(?:\[[^\]]+\]|->\w+)*\s*!!\}
  message: Blade raw tag {!! !!} renders unescaped variable content without HTML entity encoding
  why: Using raw unescaped Blade tags ({!! !!}) bypasses Laravel's default htmlspecialchars()
    protection, leaving the rendered view vulnerable to Cross-Site Scripting (XSS).
  fix: Use standard double-brace escaping ({{ $variable }}) instead of raw tags ({!! $variable !!})
    unless rendering sanitized HTML.

- id: php/memory-limit-disabled
  name: PHP memory limit disabled
  domain: appsec
  severity: high
  confidence: confirmed
  tier: immediate
  cwe: CWE-770
  owasp: A05:2021
  files:
    - "**/*.php"
  match:
    regex: \bini_set\s*\(\s*(["'])memory_limit\1\s*,\s*(?:["']-1["']|-1|["']0["']|0)\s*\)
    not_regex: (?i)^\s*(//|\*|/\*|#)
  message: PHP memory limit disabled via ini_set, enabling memory exhaustion and allocator corruption
  why: Disabling PHP's memory limit (setting it to -1 or 0) removes Zend MM allocation guards.
    In persistent runtimes (FrankenPHP, Swoole, RoadRunner) and standard PHP-FPM, unbounded memory consumption
    triggers integer overflows and allocator corruption (e.g. PHP2Shell CVE-2026-109618, CVE-2026-109619),
    turning request memory amplification into arbitrary memory corruption and host denial of service.
  fix: Specify a concrete, bounded memory limit (such as ini_set('memory_limit', '512M'))
    or manage batch workloads using chunking and generator streams instead of removing safety caps.

- id: php/worker-state-leak
  name: Request or user identity retained in static class property in persistent runtime
  domain: appsec
  severity: high
  confidence: firm
  tier: immediate
  cwe: CWE-488
  owasp: A01:2021
  files:
    - "**/*.php"
  match:
    regex: (?:\b(?:self|static)\s*::\s*\$(?:user|currentUser|current_user|tenant|currentTenant|auth|session|currentRequest|request)\s*=|public\s+static\s+(?:\$[a-zA-Z_]\w*\s*)?(?:\b(?:User|Tenant|Session|Request)\b|\$(?:currentUser|currentTenant|user|tenant|request)\b))
    not_regex: (?i)^\s*(//|\*|/\*|#)
  message: Request or authentication context assigned to static class property
  why: Assigning per-request state (user, tenant, request, session) to static class properties
    leaks identity across concurrent or consecutive requests in persistent worker runtimes (FrankenPHP worker mode,
    Laravel Octane, Swoole, RoadRunner). In these environments, workers persist across requests, causing subsequent
    requests to execute under the previous caller's identity.
  fix: Avoid static properties for request-scoped state. Use Laravel context (Context::add()), dependency
    injection into controller methods, or request attributes ($request->attributes->set()) that are destroyed with each HTTP cycle.
