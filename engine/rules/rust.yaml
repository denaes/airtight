- id: rust/command-injection
  name: Operating system command executed via shell interpreter
  domain: appsec
  severity: critical
  confidence: firm
  tier: immediate
  cwe: CWE-78
  owasp: A03:2021
  files:
    - "**/*.rs"
  match:
    regex: ^(?!\s*(?://|/\*|\*)).*?\b(?:[a-zA-Z0-9_]+::)*Command::new\s*\(\s*(["'])(?:(?:/(?:usr/)?bin/)?(?:ba|z|da)?sh|cmd(?:\.exe)?|powershell(?:\.exe)?|pwsh(?:\.exe)?)\1\s*\)(?:\s*\.[a-zA-Z0-9_]+\s*\([^)]*\))*?\s*\.(?:arg\s*\(\s*["'](?:-c|/[cC])["']\s*\)\s*\.arg\((?!\s*r?#*["'])\s*|args\s*\(\s*&?\[\s*["'](?:-c|/[cC])["']\s*,(?!\s*r?#*["'])\s*)
  message: Rust Command invokes shell interpreter with formatted or variable
    command string
  why: Executing commands through a shell interpreter with dynamic or formatted
    arguments allows arbitrary command injection via shell metacharacters.
  fix: Pass arguments directly to the executable using .arg() or .args() instead
    of invoking a shell with -c.
- id: rust/steal-credential-file
  name: Access to sensitive credential file
  domain: secrets
  severity: critical
  confidence: confirmed
  tier: immediate
  cwe: CWE-200
  owasp: A01:2021
  files:
    - "**/*.rs"
  match:
    regex: (?i)(?:read_to_string|read|File::open)\s*\([^)]*["'].*?(?:\.ssh[\/\\](?:id_rsa|id_ed25519|id_ecdsa)|\.aws[\/\\]credentials|\.kube[\/\\]config|\.docker[\/\\]config\.json)
  message: Sensitive credential file path is accessed directly
  why: Accessing private SSH keys, AWS credentials, Kubernetes configs, or Docker
    auth tokens directly from disk is characteristic of credential harvesting
    malware. Legitimate applications should use standard identity SDKs or
    environment injection.
  fix: Use standard credential provider chains (such as aws-config) or pass
    credentials via environment variables rather than reading local user
    credential directories directly.
- id: rust/sql-format
  name: SQL query constructed with format!
  domain: appsec
  severity: high
  confidence: confirmed
  tier: immediate
  cwe: CWE-89
  owasp: A03:2021
  files:
    - "**/*.rs"
  match:
    regex: (?i)(?:sqlx::query(?:_as)?|diesel::sql_query)\s*\(\s*(?:&format!|format!)\s*\(\s*["'].*?(?:SELECT|INSERT|UPDATE|DELETE|DROP)\b
  message: SQL query is constructed via format! instead of parameter binding
  why: Formatting SQL query strings with format! interpolates untrusted values
    directly into the query, enabling SQL injection.
  fix: Use parameterized queries with bind variables (e.g., sqlx::query("SELECT
    ... WHERE id = $1").bind(id)).
- id: rust/env-exfiltration
  name: Bulk environment variable harvesting
  domain: secrets
  severity: high
  confidence: confirmed
  tier: deep
  cwe: CWE-200
  owasp: A01:2021
  files:
    - "**/*.rs"
  match:
    regex: (?:\bstd::)?env::vars\s*\(\)
  message: All environment variables are enumerated in bulk
  why: Iterating std::env::vars() dumps the entire process environment, which
    typically holds API tokens, database passwords, and cloud keys. This is
    characteristic of supply-chain telemetry or exfiltration payloads.
  fix: Read only the specific environment variables required by your application
    via std::env::var("NAME").
- id: rust/path-traversal
  name: Path constructed with format! string interpolation
  domain: appsec
  severity: high
  confidence: confirmed
  tier: immediate
  cwe: CWE-22
  owasp: A01:2021
  files:
    - "**/*.rs"
  match:
    regex: (?i)(?:Path::new|PathBuf::from|\.join)\s*\(\s*(?:&format!|format!)\s*\(\s*["'].*?(?:\{}|%s).*?\)\s*\)
    not_regex: (?i)^\s*//
  message: Filesystem path is constructed using format! string interpolation
  why: Interpolating user input directly into file paths allows path traversal
    (e.g., ../../etc/passwd) to access files outside the intended directory.
  fix: Validate that components do not contain path separators or '..', and ensure
    canonicalized paths reside within the allowed base directory.
- id: rust/tls-insecure-skip-verify
  name: TLS certificate verification disabled
  domain: appsec
  severity: high
  confidence: confirmed
  tier: immediate
  cwe: CWE-295
  owasp: A07:2021
  files:
    - "**/*.rs"
  match:
    regex: (?i)\.(?:danger_accept_invalid_certs|danger_accept_invalid_hostnames)\s*\(\s*true\s*\)
    not_regex: (?i)^\s*//
  message: TLS certificate or hostname verification is explicitly disabled
  why: Disabling certificate validation allows network attackers to perform
    man-in-the-middle (MitM) attacks and decrypt or alter traffic.
  fix: Remove danger_accept_invalid_certs(true) and add custom CA certificates to
    the certificate store if private certificates are needed.
