- id: secret/google-api-key
  name: Google API key in source
  domain: secrets
  severity: high
  confidence: firm
  tests: report
  tier: immediate
  cwe: CWE-798
  files: ['**/*']
  match:
    regex: '\b(AIza[0-9A-Za-z_-]{35})\b'
    not_regex: 'EXAMPLE|PLACEHOLDER|YOUR_|<your'
  redact: true
  message: Google API key committed to source
  why: >-
    Unless the key is restricted by referrer, IP, or API, anyone holding it can
    bill usage to your project.
  fix: Rotate the key in Google Cloud credentials and apply API and application restrictions to the replacement.

- id: secret/npm-token
  name: npm access token in source
  domain: secrets
  severity: critical
  confidence: confirmed
  tests: report
  tier: immediate
  cwe: CWE-798
  files: ['**/*']
  match:
    regex: '\b(npm_[A-Za-z0-9]{36})\b'
    not_regex: 'EXAMPLE|PLACEHOLDER|YOUR_|<your'
  redact: true
  message: npm access token committed to source
  why: >-
    A publish-scoped npm token lets an attacker ship a malicious version of your
    package to everyone who installs it. This is the supply chain attack, not a
    theoretical one.
  fix: Revoke the token at npmjs.com, then publish from CI with a short-lived OIDC-issued token.

- id: secret/sendgrid-key
  name: SendGrid API key in source
  domain: secrets
  severity: high
  confidence: confirmed
  tests: report
  cwe: CWE-798
  files: ['**/*']
  match:
    regex: '\b(SG\.[A-Za-z0-9_-]{22}\.[A-Za-z0-9_-]{43})\b'
    not_regex: 'EXAMPLE|PLACEHOLDER|YOUR_|<your'
  redact: true
  message: SendGrid API key committed to source
  why: Mail-sending credentials let an attacker send phishing that passes your own SPF and DKIM checks.
  fix: Revoke the key in SendGrid settings and load the replacement from a secret manager.

- id: secret/private-key-pem
  name: Private key in source
  domain: secrets
  severity: critical
  confidence: confirmed
  tier: immediate
  cwe: CWE-798
  owasp: A02:2021
  files: ['**/*']
  match:
    regex: '(-----BEGIN (?:RSA |EC |DSA |OPENSSH |PGP |ENCRYPTED )?PRIVATE KEY-----)'
    not_regex: 'EXAMPLE|PLACEHOLDER|YOUR_|<your'
  redact: true
  message: Private key material committed to source
  why: >-
    A committed private key undermines every identity it authenticates: TLS
    termination, SSH access, signed artifacts, or JWT issuance.
  fix: >-
    Treat the key as compromised. Generate a new pair, rotate everything that
    trusted the old one, and revoke the old certificate if one was issued.

- id: secret/jwt-with-claims
  name: JWT with real claims in source
  domain: secrets
  severity: medium
  confidence: firm
  cwe: CWE-798
  files: ['**/*']
  match:
    regex: '\b(eyJ[A-Za-z0-9_-]{10,}\.eyJ[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{10,})\b'
    not_regex: 'EXAMPLE|PLACEHOLDER|YOUR_|<your'
  redact: true
  message: Signed JWT committed to source
  why: >-
    A committed JWT is a bearer credential that works until it expires, and
    tokens minted for service accounts frequently do not expire at all.
  fix: Revoke the session or key that signed it, and load tokens at runtime rather than committing them.

- id: secret/env-file-tracked
  name: Environment file tracked in git
  domain: secrets
  severity: high
  confidence: firm
  tests: report
  tier: immediate
  cwe: CWE-538
  files: ['**/.env', '**/.env.*']
  exclude: ['**/.env.example', '**/.env.sample', '**/.env.template', '**/.env.dist']
  match:
    regex: '^\s*(?:export\s+)?([A-Z][A-Z0-9_]{2,})\s*='
    not_regex: '^\s*#'
  snippet: capture
  message: Environment file with assignments is present in the working tree
  why: >-
    .env files are the single most common way a real credential reaches a public
    repository, because the file is invisible in most editors and easy to git
    add -A by accident.
  fix: >-
    Add .env to .gitignore, commit a .env.example with empty values instead, and
    run git rm --cached .env if it was ever committed.

- id: secret/high-entropy-assignment
  name: High-entropy value assigned to a credential-shaped name
  domain: secrets
  severity: high
  confidence: tentative
  cwe: CWE-798
  files: ['**/*']
  exclude:
    - '**/package-lock.json'
    - '**/yarn.lock'
    - '**/pnpm-lock.yaml'
    - '**/Cargo.lock'
    - '**/poetry.lock'
    - '**/go.sum'
    - '**/*.min.js'
  parse: js
  script: entropy
  redact: true
  snippet: capture
  message: A high-entropy literal is assigned to a credential-shaped name
  why: >-
    No provider rule recognized this value, which means it is either a
    credential for something we do not have a signature for, or a false
    positive. It is reported as tentative for exactly that reason: confirm it
    before acting, and do not rotate anything on this finding alone.
  fix: >-
    If it is a credential, rotate it and load it from the environment or a
    secret manager. If it is not, add an inline waiver naming what it actually
    is so the next reader does not have to work it out again.
