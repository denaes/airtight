# Secrets pack.
#
# The highest-precision domain we have: a provider token format either is that
# provider's token or it is not. Every rule here sets `redact: true`, which
# routes the matched value through the scan vault so it can never reach stdout.
#
# Capture group 1 is always the credential itself. That is what gets
# fingerprinted for the findings store and masked in the snippet.
#
# `not_regex` is tested against the whole line, which is how a documented
# example key on the same line stands the rule down.

- id: secret/aws-access-key-id
  name: AWS access key ID in source
  domain: secrets
  severity: critical
  confidence: confirmed
  tests: report
  tier: immediate
  cwe: CWE-798
  owasp: A07:2021
  files: ['**/*']
  match:
    regex: '\b((?:AKIA|ASIA|ABIA|ACCA)[0-9A-Z]{16})\b'
    not_regex: 'EXAMPLE|AKIAIOSFODNN7|PLACEHOLDER|YOUR_|<your'
  redact: true
  message: AWS access key ID committed to source
  why: >-
    A live access key grants API access to the account until it is rotated, and
    git history retains it after the line is deleted.
  fix: >-
    Rotate the key in IAM now, then load it from the environment, an instance
    role, or a secret manager. Deleting the line is not enough.

- id: secret/aws-secret-access-key
  name: AWS secret access key in source
  domain: secrets
  severity: critical
  confidence: firm
  tests: report
  tier: immediate
  cwe: CWE-798
  owasp: A07:2021
  files: ['**/*']
  match:
    regex: '(?i)aws_?secret_?access_?key["'']?\s*[:=]\s*["'']?([A-Za-z0-9/+=]{40})'
    not_regex: 'EXAMPLE|wJalrXUtnFEMI|PLACEHOLDER|YOUR_|<your'
  redact: true
  message: AWS secret access key committed to source
  why: >-
    Paired with an access key ID this is full API credentials. Secret keys
    cannot be viewed again after creation, so a leaked one is usually the only
    copy an attacker needs.
  fix: Rotate the key pair in IAM, then load both halves from the environment or a secret manager.

- id: secret/github-token
  name: GitHub token in source
  domain: secrets
  severity: critical
  confidence: confirmed
  tests: report
  tier: immediate
  cwe: CWE-798
  owasp: A07:2021
  files: ['**/*']
  match:
    regex: '\b((?:ghp|gho|ghu|ghs|ghr)_[A-Za-z0-9]{36}|github_pat_[A-Za-z0-9_]{82})\b'
    not_regex: 'EXAMPLE|PLACEHOLDER|YOUR_|<your'
  redact: true
  message: GitHub personal access or app token committed to source
  why: >-
    Depending on its scopes this token can read private repositories, push
    code, and alter CI, which makes it a direct path into the build pipeline.
  fix: Revoke the token in GitHub developer settings, then use a short-lived Actions token or an app installation token.

- id: secret/gitlab-token
  name: GitLab token in source
  domain: secrets
  severity: critical
  confidence: confirmed
  tests: report
  tier: immediate
  cwe: CWE-798
  files: ['**/*']
  match:
    regex: '\b(glpat-[A-Za-z0-9_-]{20})\b'
    not_regex: 'EXAMPLE|PLACEHOLDER|YOUR_|<your'
  redact: true
  message: GitLab personal access token committed to source
  why: A GitLab PAT carries the user's own repository and registry access, including write scopes.
  fix: Revoke the token in GitLab access tokens settings and replace it with a CI job token or deploy token.

- id: secret/slack-token
  name: Slack token in source
  domain: secrets
  severity: high
  confidence: confirmed
  tests: report
  tier: immediate
  cwe: CWE-798
  files: ['**/*']
  match:
    regex: '\b(xox[baprs]-[A-Za-z0-9-]{10,})\b'
    not_regex: 'EXAMPLE|PLACEHOLDER|YOUR_|<your'
  redact: true
  message: Slack API token committed to source
  why: Slack tokens can read channel history and post as the app or user, which makes them useful for both data theft and phishing.
  fix: Revoke the token in the Slack app configuration and rotate it into a secret manager.

- id: secret/stripe-live-key
  name: Stripe live secret key in source
  domain: secrets
  severity: critical
  confidence: confirmed
  tests: report
  tier: immediate
  cwe: CWE-798
  files: ['**/*']
  match:
    regex: '\b((?:sk|rk)_live_[A-Za-z0-9]{20,})\b'
    not_regex: 'EXAMPLE|PLACEHOLDER|YOUR_|<your'
  redact: true
  message: Stripe live secret key committed to source
  why: A live Stripe secret key can move real money and read customer payment records.
  fix: Roll the key in the Stripe dashboard immediately, then load it from a secret manager.

- id: secret/anthropic-key
  name: Anthropic API key in source
  domain: secrets
  severity: high
  confidence: confirmed
  tests: report
  tier: immediate
  cwe: CWE-798
  files: ['**/*']
  match:
