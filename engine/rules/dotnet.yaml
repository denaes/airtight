- id: dotnet/sql-string-concat
  name: SQL statement executed with dynamic string concatenation or interpolation
  domain: appsec
  severity: critical
  confidence: firm
  tier: immediate
  cwe: CWE-89
  owasp: A03:2021
  files:
    - "**/*.cs"
  match:
    regex: (?i)^(?!\s*(?://|\*|/\*)).*?(?:\b(?:FromSqlRaw|ExecuteSqlRaw|ExecuteSqlRawAsync|FromSqlInterpolated|SqlCommand)\s*\(\s*(?:(["'])(?:(?!\1).)*(?:\bSELECT\b(?:(?!\1).)*\bFROM\b|\bINSERT\s+INTO\b|\bUPDATE\b(?:(?!\1).)*\bSET\b|\bDELETE\s+FROM\b)(?:(?!\1).)*\1\s*\+|\$"(?:[^"]*)\b(?:SELECT\b[^"]*\bFROM\b|INSERT\s+INTO|UPDATE\b[^"]*\bSET\b|DELETE\s+FROM)[^"]*\{[a-zA-Z_]))
  message: SQL statement constructed via string concatenation or interpolated string instead of parameterized parameters
  why: Concatenating or interpolating variables into raw SQL queries in EF Core or ADO.NET
    bypasses query parameterization, allowing attackers to inject arbitrary SQL statements.
  fix: Use parameterized query overloads (FromSqlRaw with parameter markers {0}, {1} or SqlParameter)
    or EF Core 7+ FromSql with FormattableString interpolation.

- id: dotnet/command-injection
  name: Process execution invoked with shell interpreter and dynamic command string
  domain: appsec
  severity: critical
  confidence: firm
  tier: immediate
  cwe: CWE-78
  owasp: A03:2021
  files:
    - "**/*.cs"
  match:
    regex: (?i)^(?!\s*(?://|\*|/\*)).*?(?:\bProcess\.Start\s*\(\s*(["'])(?:(?!\1).)*\b(?:cmd(?:\.exe)?|powershell(?:\.exe)?|(?:/(?:usr/)?bin/)?(?:ba|z)?sh)\b(?:(?!\1).)*\1\s*,\s*(?:\$"(?:[^"]*)\{[a-zA-Z_]|(["'])(?:(?!\2).)*(?:[/-]c|-Command)\b(?:(?!\2).)*\2\s*\+)|\bnew\s+ProcessStartInfo\s*\(\s*(["'])(?:(?!\3).)*\b(?:cmd(?:\.exe)?|powershell(?:\.exe)?|(?:/(?:usr/)?bin/)?(?:ba|z)?sh)\b(?:(?!\3).)*\3\s*,\s*\$")
  message: Process.Start invokes shell interpreter with concatenated or interpolated command string
  why: Invoking a shell interpreter (cmd.exe, powershell.exe, sh, bash) with dynamic arguments
    allows command injection through shell metacharacters and operators.
  fix: Pass arguments safely as separate items using ProcessStartInfo.ArgumentList without invoking a shell.

- id: dotnet/insecure-deserialization
  name: Arbitrary object deserialization from untrusted streams
  domain: appsec
  severity: critical
  confidence: confirmed
  tier: immediate
  cwe: CWE-502
  owasp: A08:2021
  files:
    - "**/*.cs"
  match:
    regex: (?i)^(?!\s*(?://|\*|/\*)).*?(?:\b(?:BinaryFormatter|NetDataContractSerializer|SoapFormatter)\b.*?\.\s*Deserialize\s*\(|\bTypeNameHandling\s*=\s*TypeNameHandling\.(?:Auto|All|Objects|Arrays)\b)
  message: BinaryFormatter or Json.NET TypeNameHandling allows remote code execution via object deserialization
  why: BinaryFormatter and Json.NET TypeNameHandling automatically resolve and instantiate
    arbitrary types specified in serialized payloads, enabling remote code execution via gadget chains.
  fix: Use System.Text.Json with explicit DTO types, or set TypeNameHandling = TypeNameHandling.None in Newtonsoft.Json.

- id: dotnet/weak-password-hash
  name: Insecure hash algorithm used for password hashing
  domain: appsec
  severity: high
  confidence: confirmed
  tier: immediate
  cwe: CWE-328
  owasp: A02:2021
  files:
    - "**/*.cs"
  match:
    regex: (?i)^(?!\s*(?://|\*|/\*)).*?(?:\b(?:MD5|SHA1)\.(?:Create|ComputeHash)\b.*?(?:pwd|pass|password|hashpassword|passwd|userpassword))
  message: MD5 or SHA1 hash algorithm used for password hashing
  why: MD5 and SHA1 are cryptographically broken, un-salted, and computationally fast algorithms
    vulnerable to rainbow table attacks and high-speed GPU hash cracking.
  fix: Use ASP.NET Core PasswordHasher<T>, PBKDF2 (Rfc2898DeriveBytes), or Argon2id with random salts.
