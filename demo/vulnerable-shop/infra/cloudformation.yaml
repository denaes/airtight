AWSTemplateFormatVersion: '2010-09-09'
Description: Deliberately vulnerable CloudFormation template for demo

Resources:
  VulnerableBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: demo-vulnerable-bucket
      AccessControl: PublicRead

  VulnerableSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group with sensitive ports open
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0
