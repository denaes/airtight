name: x
on: [push]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - run: echo "$TITLE"
        env:
          TITLE: ${{ github.event.issue.title }}
      - run: echo "${{ github.repository }}"
      - run: echo "${{ github.sha }}"
      - run: echo "${{ github.run_id }}"
      - run: npm test
      - run: echo "${{ github.event.pull_request.number }}"
