name: Safe Workflows
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  safe_job:
    runs-on: ubuntu-latest
    steps:
      - name: Safe download on push
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: build-artifact
      - name: Safe build step
        run: npm test
      - name: Safe dawidd6 on push
        uses: dawidd6/action-download-artifact@0c8882e5e729a6bd77a9446d1bf4756541f5348d # v3.1.4
        with:
          workflow: build.yml
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Notify on completion
        run: echo "Workflow finished successfully"
