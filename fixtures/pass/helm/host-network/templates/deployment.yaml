apiVersion: apps/v1
kind: Deployment
metadata:
  name: pass-hostnet-deploy
spec:
  template:
    spec:
      hostNetwork: false
      containers:
        - name: app
          image: nginx:1.25
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: pass-hostnet-ds
spec:
  template:
    spec:
      containers:
        - name: agent
          image: agent:2.0
---
apiVersion: v1
kind: Pod
metadata:
  name: pass-hostnet-pod
spec:
  containers:
    - name: worker
      image: redis:7
---
apiVersion: v1
kind: Service
metadata:
  name: pass-hostnet-svc
spec:
  ports:
    - port: 80
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: pass-hostnet-config
data:
  network: overlay
