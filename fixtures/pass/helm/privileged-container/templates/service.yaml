apiVersion: v1
kind: Service
metadata:
  name: pass-helm-service
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: pass-helm-config
data:
  app.conf: |
    debug = false
---
apiVersion: v1
kind: Pod
metadata:
  name: pass-helm-pod
spec:
  containers:
    - name: worker
      image: redis:7
      securityContext:
        capabilities:
          drop:
            - ALL
