apiVersion: v1
kind: Pod
metadata:
  name: secured-runtimedefault-pod
  namespace: default
  annotations:
    container.apparmor.security.beta.kubernetes.io/web: runtime/default
spec:
  containers:
    - name: web
      image: nginx:1.25
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: secured-deployment
  namespace: prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
      annotations:
        container.apparmor.security.beta.kubernetes.io/api: runtime/default
    spec:
      containers:
        - name: api
          image: api:1.0
---
apiVersion: v1
kind: Pod
metadata:
  name: secured-localhost-pod
  namespace: default
  annotations:
    container.apparmor.security.beta.kubernetes.io/web: localhost/custom-nginx-profile
spec:
  containers:
    - name: web
      image: nginx:1.25
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: secured-statefulset
  namespace: data
spec:
  serviceName: db
  selector:
    matchLabels:
      app: db
  template:
    metadata:
      labels:
        app: db
      annotations:
        container.apparmor.security.beta.kubernetes.io/db: runtime/default
    spec:
      containers:
        - name: db
          image: redis:7
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: default
data:
  LOG_LEVEL: info
---
apiVersion: v1
kind: Service
metadata:
  name: app-service
  namespace: default
spec:
  selector:
    app: api
  ports:
    - port: 80
      targetPort: 8080
