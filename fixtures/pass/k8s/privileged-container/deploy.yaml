apiVersion: apps/v1
kind: Deployment
metadata:
  name: a
  namespace: apps
spec:
  template:
    spec:
      containers:
        - name: app
          image: app@sha256:1a2b3c4d5e6f7890abcdef1234567890abcdef1234567890abcdef1234567890
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 10001
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            limits:
              memory: 256Mi
              cpu: 500m
      initContainers:
        - name: init
          image: busybox:1.36
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
          resources:
            limits:
              memory: 64Mi
