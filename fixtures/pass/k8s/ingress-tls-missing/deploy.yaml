apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: secured-single-host
  namespace: web
spec:
  tls:
    - hosts:
        - api.example.com
      secretName: api-tls-cert
  rules:
    - host: api.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-service
                port:
                  number: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: secured-multi-host
  namespace: web
spec:
  tls:
    - hosts:
        - app.example.com
      secretName: app-tls-cert
    - hosts:
        - admin.example.com
      secretName: admin-tls-cert
  rules:
    - host: app.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: app-service
                port:
                  number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: secured-wildcard
  namespace: prod
spec:
  tls:
    - hosts:
        - "*.example.com"
      secretName: wildcard-tls
  rules:
    - host: portal.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: portal-service
                port:
                  number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: default-backend-only
  namespace: prod
spec:
  defaultBackend:
    service:
      name: fallback
      port:
        number: 80
---
apiVersion: v1
kind: Service
metadata:
  name: lb-service
  namespace: prod
spec:
  type: LoadBalancer
  ports:
    - port: 443
      targetPort: 8443
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ingress-config
  namespace: web
data:
  proxy-connect-timeout: "15"
