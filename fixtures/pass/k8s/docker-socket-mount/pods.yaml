apiVersion: v1
kind: Pod
metadata:
  name: a
  namespace: apps
spec:
  volumes:
    - name: data
      emptyDir: {}
  containers:
    - name: app
      image: app:1.0
---
apiVersion: v1
kind: Pod
metadata:
  name: b
  namespace: apps
spec:
  volumes:
    - name: cfg
      configMap:
        name: cfg
  containers:
    - name: app
      image: app:1.0
---
apiVersion: v1
kind: Pod
metadata:
  name: c
  namespace: apps
spec:
  volumes:
    - name: pvc
      persistentVolumeClaim:
        claimName: data
  containers:
    - name: app
      image: app:1.0
---
apiVersion: v1
kind: Pod
metadata:
  name: d
  namespace: apps
spec:
  volumes:
    - name: logs
      hostPath:
        path: /var/log/app
  containers:
    - name: app
      image: app:1.0
---
apiVersion: v1
kind: Pod
metadata:
  name: e
  namespace: apps
spec:
  containers:
    - name: app
      image: app:1.0
