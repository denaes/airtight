version: "3.8"
services:
  agent1:
    image: docker:dind
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
  agent2:
    image: docker:cli
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
  agent3:
    image: test:1.0
    volumes:
      - /run/docker.sock:/run/docker.sock
  agent4:
    image: monitor:latest
    volumes:
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
