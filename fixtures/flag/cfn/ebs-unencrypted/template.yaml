AWSTemplateFormatVersion: '2010-09-09'
Description: Unencrypted EBS volumes

Resources:
  FlagVolumeExplicitFalse:
    Type: AWS::EC2::Volume
    Properties:
      AvailabilityZone: us-east-1a
      Size: 100
      Encrypted: false

  FlagVolumeOmittedEncrypted:
    Type: AWS::EC2::Volume
    Properties:
      AvailabilityZone: us-east-1a
      Size: 50
      VolumeType: gp3

  FlagVolumeStringFalse:
    Type: AWS::EC2::Volume
    Properties:
      AvailabilityZone: us-east-1b
      Size: 200
      Encrypted: 'false'

  FlagVolumeBareProperties:
    Type: AWS::EC2::Volume
    Properties:
      AvailabilityZone: us-east-1c
