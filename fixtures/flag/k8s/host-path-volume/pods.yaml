apiVersion: v1
kind: Pod
metadata:
  name: h0
  namespace: apps
spec:
  volumes:
    - name: v
      hostPath:
        path: /var/log/app
  containers:
    - name: app
      image: app:1.0
---
apiVersion: v1
kind: Pod
metadata:
  name: h1
  namespace: apps
spec:
  volumes:
    - name: v
      hostPath:
        path: /etc/kubernetes
  containers:
    - name: app
      image: app:1.0
---
apiVersion: v1
kind: Pod
metadata:
  name: h2
  namespace: apps
spec:
  volumes:
    - name: v
      hostPath:
        path: /home/data
  containers:
    - name: app
      image: app:1.0
---
apiVersion: v1
kind: Pod
metadata:
  name: h3
  namespace: apps
spec:
  volumes:
    - name: v
      hostPath:
        path: /opt/shared
  containers:
    - name: app
      image: app:1.0
