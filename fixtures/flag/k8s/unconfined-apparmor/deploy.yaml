apiVersion: v1
kind: Pod
metadata:
  name: unconfined-pod
  namespace: default
  annotations:
    container.apparmor.security.beta.kubernetes.io/web: unconfined
spec:
  containers:
    - name: web
      image: nginx:1.25
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: unconfined-deployment
  namespace: prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
      annotations:
        container.apparmor.security.beta.kubernetes.io/api: unconfined
    spec:
      containers:
        - name: api
          image: api:1.0
---
apiVersion: v1
kind: Pod
metadata:
  name: missing-apparmor-pod
  namespace: default
spec:
  containers:
    - name: app
      image: app:1.0
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: missing-apparmor-daemonset
  namespace: monitoring
spec:
  selector:
    matchLabels:
      app: exporter
  template:
    metadata:
      labels:
        app: exporter
    spec:
      containers:
        - name: exporter
          image: node-exporter:1.0
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: unconfined-statefulset
  namespace: data
spec:
  serviceName: db
  selector:
    matchLabels:
      app: db
  template:
    metadata:
      labels:
        app: db
      annotations:
        container.apparmor.security.beta.kubernetes.io/db: unconfined
    spec:
      containers:
        - name: db
          image: redis:7
