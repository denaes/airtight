apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: single-host-no-tls
  namespace: web
spec:
  rules:
    - host: api.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-service
                port:
                  number: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: multi-host-no-tls
  namespace: web
spec:
  rules:
    - host: app.example.com
      http:
        paths:
          - path: /app
            pathType: Prefix
            backend:
              service:
                name: app-service
                port:
                  number: 80
    - host: admin.example.com
      http:
        paths:
          - path: /admin
            pathType: Prefix
            backend:
              service:
                name: admin-service
                port:
                  number: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: path-routing-no-tls
  namespace: prod
spec:
  rules:
    - host: portal.example.com
      http:
        paths:
          - path: /auth
            pathType: Exact
            backend:
              service:
                name: auth-service
                port:
                  number: 4000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: annotated-no-tls
  namespace: prod
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  rules:
    - host: public.example.com
      http:
        paths:
          - path: /v1
            pathType: Prefix
            backend:
              service:
                name: public-api
                port:
                  number: 3000
