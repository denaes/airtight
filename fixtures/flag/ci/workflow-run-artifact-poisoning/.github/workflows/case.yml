name: Privileged Run
on:
  workflow_run:
    workflows: ["PR Checks"]
    types: [completed]
permissions:
  contents: read
jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact via action
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          run-id: ${{ github.event.workflow_run.id }}
          name: pr-output
      - name: Download via third party action
        uses: dawidd6/action-download-artifact@0c8882e5e729a6bd77a9446d1bf4756541f5348d # v3.1.4
        with:
          workflow: pr.yml
          run_id: ${{ github.event.workflow_run.id }}
      - name: Download via gh CLI
        run: gh run download ${{ github.event.workflow_run.id }} -n pr-payload
      - name: Download artifact legacy action
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: artifacts
